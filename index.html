<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>HeliumSol — Websites, Apps, Chatbots & Automation for Growing Businesses</title>
    <meta
      name="description"
      content="HeliumSol is a full-service digital agency building high-performance websites, web &amp; mobile apps, AI chatbots, and n8n workflow automation. Book a free discovery call."
    />
    <meta name="theme-color" content="#142540" />

    <!--
      Favicon: an H lettermark on the brand navy.

      This replaces a white square rotated 45 degrees inside the same rounded
      navy tile. At favicon size that shape read as the Angular framework's
      logo — a dark rounded shield with a white geometric mark in the middle —
      which is not an association this site wants in a tab strip. A letterform
      cannot be mistaken for another product's logo.

      Inline as a data URI rather than a file so it survives `vite build`
      emptying dist/ and needs no entry in a public/ directory that does not
      exist yet.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23142540'/%3E%3Cpath d='M10 8h3.5v6.25h5V8H22v16h-3.5v-6.25h-5V24H10Z' fill='%23ffffff'/%3E%3C/svg%3E"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HeliumSol — Full-Service Digital Agency" />
    <meta
      property="og:description"
      content="Websites, apps, AI chatbots and workflow automation — built to grow your business."
    />
    <!-- TODO: add a 1200x630 share image at /og-image.png and set the absolute URL once the domain is live -->
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HeliumSol — Full-Service Digital Agency" />
    <meta
      name="twitter:description"
      content="Websites, apps, AI chatbots and workflow automation — built to grow your business."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Set theme before paint to avoid a flash; defaults to system preference -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored === "dark" || (!stored && systemDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
