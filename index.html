<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>HeliumSol — Websites, Apps, Chatbots & Automation for Growing Businesses</title>
    <meta
      name="description"
      content="HeliumSol is a full-service digital agency. We design and build high-performance websites, web & mobile apps, AI chatbots, and n8n automation — plus SEO and Google Business Profile growth. Book a free discovery call."
    />
    <meta name="theme-color" content="#142540" />

    <!-- Favicon (brand mark) -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23142540'/%3E%3Cg transform='rotate(45 16 16)'%3E%3Crect x='10.5' y='10.5' width='11' height='11' rx='2' fill='%23ffffff'/%3E%3C/g%3E%3C/svg%3E"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HeliumSol — Full-Service Digital Agency" />
    <meta
      property="og:description"
      content="Websites, apps, AI chatbots, automation, SEO & Google Business Profile — built to grow your business."
    />
    <!-- TODO: add a 1200x630 share image at /og-image.png and set the absolute URL once the domain is live -->
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HeliumSol — Full-Service Digital Agency" />
    <meta
      name="twitter:description"
      content="Websites, apps, AI chatbots, automation, SEO & Google Business Profile — built to grow your business."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Set theme before paint to avoid a flash; defaults to system preference -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored === "dark" || (!stored && systemDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
