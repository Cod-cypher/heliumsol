<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#142540;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#fff}
  .wrap{position:relative;width:1200px;height:630px;background:radial-gradient(900px 500px at 15% 10%,#243f63 0%,#142540 55%,#0d1a2e 100%)}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:80px 80px;mask-image:radial-gradient(ellipse 70% 60% at 50% 50%,#000 60%,transparent 100%)}
  .mark{position:absolute;left:96px;top:96px;width:96px;height:96px;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center}
  .mark span{font-weight:800;font-size:64px;color:#142540;line-height:1}
  .name{position:absolute;left:216px;top:112px;font-size:44px;font-weight:700;letter-spacing:-0.02em}
  .name b{color:#9db4d6;font-weight:600}
  .title{position:absolute;left:96px;top:270px;width:1010px;font-size:66px;font-weight:800;line-height:1.08;letter-spacing:-0.03em}
  .sub{position:absolute;left:96px;top:468px;font-size:28px;color:#c5d4e8;font-weight:500}
  .url{position:absolute;right:96px;bottom:60px;font-size:24px;color:#9db4d6;font-weight:600;letter-spacing:.02em}
</style>
</head>
<body>
<div class="wrap">
  <div class="grid"></div>
  <div class="mark"><span>H</span></div>
  <div class="name">Helium<b>Sol</b></div>
  <div class="title">Websites, apps, AI chatbots<br>and automation that work.</div>
  <div class="sub">Full-service digital agency · Start with a free website and chatbot</div>
  <div class="url">heliumsol.com</div>
</div>
</body>
</html>
