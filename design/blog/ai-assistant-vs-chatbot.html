<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.bubble{position:absolute;width:520px;height:230px;border-radius:40px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700}
.bubble:after{content:"";position:absolute;left:60px;bottom:-28px;width:0;height:0;border-left:30px solid transparent;border-right:30px solid transparent;border-top:30px solid rgba(255,255,255,.18)}
.tool{position:absolute;width:150px;height:150px;border-radius:30px;background:#fff;color:#142540;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;text-align:center;line-height:1.1}
.line{position:absolute;height:4px;background:#9db4d6;transform-origin:left center}
.cap{position:absolute;font-size:30px;color:#c5d4e8;font-weight:600}
</style></head><body><div class="wrap"><div class="grid"></div>
<div class="bubble" style="left:120px;top:250px">Answers</div>
<div class="cap" style="left:120px;top:560px">Chatbot</div>
<div class="bubble" style="left:800px;top:250px">Answers + acts</div>
<div class="cap" style="left:800px;top:560px">AI assistant</div>
<div class="line" style="left:1320px;top:310px;width:120px;transform:rotate(-40deg)"></div>
<div class="line" style="left:1320px;top:365px;width:110px"></div>
<div class="line" style="left:1320px;top:420px;width:120px;transform:rotate(40deg)"></div>
<div class="tool" style="left:1400px;top:140px">Calendar</div>
<div class="tool" style="left:1400px;top:290px">Database</div>
<div class="tool" style="left:1400px;top:440px">Inbox</div>
<div class="label">AI assistant vs chatbot</div>
</div></body></html>
